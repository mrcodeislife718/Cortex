name: Cortex Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cortex-linux-x64
          - os: windows-2025
            artifact: cortex-windows-x64
          - os: macos-15
            artifact: cortex-macos
    runs-on: ${{ matrix.os }}
    env:
      VITE_CORTEX_COMMERCIAL_API_URL: ${{ vars.CORTEX_COMMERCIAL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Require Cortex commercial endpoint
        shell: bash
        run: |
          if [ -z "$VITE_CORTEX_COMMERCIAL_API_URL" ]; then
            echo "CORTEX_COMMERCIAL_API_URL repository variable is required for commercial release builds" >&2
            exit 1
          fi
          case "$VITE_CORTEX_COMMERCIAL_API_URL" in
            https://*) ;;
            *) echo "Cortex commercial API must use HTTPS" >&2; exit 1 ;;
          esac
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate Cortex platform icons
        working-directory: apps/desktop
        run: npm run tauri -- icon assets/cortex-app-icon.svg
      - name: Build Cortex desktop
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build
      - name: Upload package bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub release and publish Cortex installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Cortex ${GITHUB_REF_NAME}" --generate-notes
          find release-assets -type f -print0 | xargs -0 -r gh release upload "${GITHUB_REF_NAME}" --clobber
