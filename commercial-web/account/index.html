<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Cortex Account</title><link rel="stylesheet" href="/styles.css"/></head><body><header class="nav"><a class="brand" href="/"><span class="mark">C</span><span>CORTEX</span></a><nav><a href="/">Product</a><button id="auth-button" class="ghost">Sign in</button></nav></header><main class="account-shell"><span class="eyebrow">CORTEX ACCOUNT</span><h1>Desktop, billing and entitlement control.</h1><div id="account-card" class="account-card"><p class="status">Loading account…</p></div></main><div id="toast" class="toast" hidden></div><script type="module">import{api,state,beginLogin,refreshAccount,clearSession}from'/app.js';const card=document.getElementById('account-card');if(!state.session){card.innerHTML='<h2>Sign in to Cortex</h2><p class="status">Use your Cortex account to purchase, manage billing, download releases and activate desktop installations.</p><div class="account-actions"><button class="primary" id="login">Sign in</button></div>';document.getElementById('login').onclick=beginLogin;}else{try{const status=await refreshAccount();render(status);}catch(error){card.innerHTML=`<h2>Account unavailable</h2><p class="status">${escapeHtml(error.message)}</p>`;}}function render(status){const active=status.active;card.innerHTML=`<h2>${active?'Cortex '+String(status.plan).toUpperCase():'No active subscription'}</h2><p class="status ${active?'success':''}">${active?'Your Cortex desktop entitlement is active.':'Choose a paid Cortex plan to activate desktop access.'}</p><div class="account-actions">${active?'<button class="primary" id="activation">Activate a desktop</button><a class="secondary" id="download" target="_blank" rel="noopener">Download Cortex</a><button class="secondary" id="portal">Manage billing</button>':'<a class="primary" href="/#pricing">Choose a plan</a>'}<button class="ghost" id="logout">Sign out</button></div><div id="activation-result"></div>`;if(active){document.getElementById('download').href=state.config.releaseUrl;document.getElementById('activation').onclick=async()=>{const result=await api('activation',{method:'POST',auth:true});document.getElementById('activation-result').innerHTML=`<p class="status">Enter this one-time code in Cortex within 10 minutes:</p><div class="activation-code">${escapeHtml(result.code)}</div>`;};document.getElementById('portal').onclick=async()=>{const result=await api('portal',{method:'POST',auth:true});location.assign(result.url);};}document.getElementById('logout').onclick=()=>{clearSession();location.reload();};}function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}</script></body></html>
