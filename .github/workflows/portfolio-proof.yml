name: Portfolio Proof Gate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: portfolio-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/verify-portfolio-proof.mjs
