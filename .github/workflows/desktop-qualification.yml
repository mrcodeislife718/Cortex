name: Desktop Qualification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: desktop-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: macos-15
            bundles: app,dmg
          - os: windows-2025
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate Cortex platform icons
        working-directory: apps/desktop
        run: npm run tauri -- icon assets/cortex-app-icon.svg
      - name: Build web workbench
        working-directory: apps/desktop
        run: npm run build
      - name: Check Rust desktop runtime
        working-directory: apps/desktop/src-tauri
        run: cargo check
      - name: Build installable Cortex package
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}"
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*
            apps/desktop/src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*
            apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-macos-arm64
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*
            apps/desktop/src-tauri/target/release/bundle/macos/*
          if-no-files-found: error
