name: Desktop Qualification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: desktop-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: macos-15
            bundles: app,dmg
          - os: windows-2025
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cortex-desktop-${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            cortex-desktop-${{ runner.os }}-cargo-
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install locked desktop dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Generate Cortex platform icons
        working-directory: apps/desktop
        run: npm run tauri -- icon assets/cortex-app-icon.svg
      - name: Build web workbench
        working-directory: apps/desktop
        run: npm run build
      - name: Check locked Rust desktop runtime
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Build installable Cortex package
        working-directory: apps/desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}" -- --locked
      - name: Smoke launch packaged Cortex runtime
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set +e
          xvfb-run -a timeout 8s ./src-tauri/target/release/cortex-desktop >cortex-startup.log 2>&1
          status=$?
          set -e
          cat cortex-startup.log
          if [ "$status" -ne 124 ]; then
            echo "Cortex did not remain alive through the startup smoke window (exit $status)" >&2
            exit 1
          fi
          if grep -Eiq 'panicked|PluginInitialization|failed to run Cortex desktop runtime' cortex-startup.log; then
            echo "Cortex startup log contains a fatal runtime initialization error" >&2
            exit 1
          fi
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-macos-arm64
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
